<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viva Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><script src="/ui.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark"><span data-icon="mic"></span></span>AI Viva <span class="muted" style="font-weight:500">· Review</span></a>
  <span class="spacer"></span><a class="btn secondary" href="/faculty.html">All results</a></header>
<main class="page">
  <div class="card">
    <div class="review-head">
      <div><h1 id="title" style="margin-bottom:4px"></h1><div class="small muted" id="sub"></div><div id="reasons" style="margin-top:12px"></div></div>
      <div class="score-badge"><div class="small">Final mark</div><div class="big-num" id="final">-</div><div class="small" id="ai"></div></div>
    </div>
  </div>
  <div class="grid2">
    <div>
      <div class="card"><h2>Recording</h2><div id="audio"></div><p class="small muted hidden" id="audio-hint" style="margin-top:10px">Click any transcript line to jump to that moment.</p></div>
      <div class="card"><h2>Transcript</h2><div id="transcript"></div></div>
    </div>
    <div>
      <div class="card"><h2>Rubric marks</h2><div id="scores"></div><h3>Feedback</h3><div id="feedback"></div>
        <h3>How this was marked</h3><div class="small muted" id="meta"></div><div class="actions"><button class="secondary" id="rescore">Mark again</button></div></div>
      <div class="card"><h2>Override the mark</h2><p class="small muted">Your mark always replaces the AI's, and is logged with your name and reason.</p>
        <div class="row"><div><label for="o-name">Your name</label><input id="o-name" autocomplete="name"></div><div style="flex:0 1 140px"><label for="o-total">Mark (0-100)</label><input id="o-total" type="number" min="0" max="100" step="0.5"></div></div>
        <label for="o-reason">Reason</label><textarea id="o-reason"></textarea><p class="msg" id="o-msg"></p><div class="actions"><button id="o-save">Save override</button></div></div>
      <div class="card"><h2>Integrity and events</h2><div id="events"></div></div>
      <div class="card"><h2>Audit log</h2><div id="audit" class="small"></div></div>
    </div>
  </div>
</main>
<script src="/review.js"></script></body></html>
